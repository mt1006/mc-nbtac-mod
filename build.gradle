subprojects
{
	apply plugin: 'java'
	java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

	base
	{
		archivesName = "${mod_jar_name}-${project.name.toUpperCase()}-${minecraft_version}"
	}

	processResources
	{
		var replaceProperties =
		[
			'mod_name'                  : mod_name,
			'mod_jar_name'              : mod_jar_name,
			'mod_id'                    : mod_id,
			'mod_group'                 : mod_group,
			'mod_author'                : mod_author,
			'version'                   : version,
			'license'                   : license,
			'homepage'                  : homepage,
			'source_url'                : source_url,
			'issue_tracker'             : issue_tracker,
			'mod_description'           : mod_description,
			'minecraft_version'         : minecraft_version,
			'java_version'              : java_version,
			'version_range_fabric'      : version_range_fabric,
			'version_range_forge'       : version_range_forge,
			'fabric_loader_version'     : fabric_loader_version,
			'fabric_api_version'        : fabric_api_version,
			'forge_version'             : forge_version,
		]

		filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json'])
		{
			expand replaceProperties
		}
		inputs.properties replaceProperties
	}

	tasks.withType(JavaCompile).configureEach { it.options.encoding = 'UTF-8' }

	if (project.name != 'common')
	{
		dependencies
		{
			compileOnly project(':common')
		}

		jar
		{
			from(project.parent.projectDir.path + "/LICENSE") { rename { "LICENSE_${mod_jar_name}" } }
		}

		processResources { from project(':common').sourceSets.main.resources }
		tasks.named('compileJava', JavaCompile) { source project(':common').sourceSets.main.allSource }
	}

	project.sourceSets.main.java.srcDirs.each((File srcDir) ->
	{
		File javaDir = new File(project.projectDir, "src/main/java")
		File generatedDir = new File(project.projectDir, "src/main/generated")
		generatedDir.mkdir()

		fileTree(srcDir).visit((FileTreeElement file) ->
		{
			String path = file.getPath()
			if (!file.isDirectory()
					|| !path.contains("net/mt1006/nbtac")
					|| path.contains("net/mt1006/nbtac/api")
					|| (project.name != "common" && (path == "net/mt1006/nbtac" || path == "net/mt1006/nbtac/mixin")))
			{
				return
			}

			String packagePath = javaDir.relativePath(file.file)
			String packageInfoStr =
					"@ApiStatus.Internal\n" +
					"package ${packagePath.replace('/', '.')};\n\n" +
					"import org.jetbrains.annotations.ApiStatus;\n"

			File dir = new File(generatedDir, packagePath)
			dir.mkdirs()

			File packageInfoFile = new File(dir, "package-info.java")
			if (!packageInfoFile.exists() || packageInfoStr != packageInfoFile.getText("UTF-8"))
			{
				packageInfoFile.write(packageInfoStr, "UTF-8")
				println("Generating package info for ${packagePath}")
			}
		})
	})

	project.sourceSets.main.java.srcDirs += ["src/main/generated"]
}
